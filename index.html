<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <h1 class="logo"><span class="logo-mark">&gt;_</span> Prompt Library</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        Dark
      </button>
    </div>
  </header>

  <main class="container main">
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading" class="panel-title">New Prompt</h2>
      <form id="prompt-form" class="prompt-form" autocomplete="off">
        <div class="field">
          <label for="prompt-title">Title</label>
          <input type="text" id="prompt-title" name="title" placeholder="e.g. Code review checklist" required />
        </div>
        <div class="field">
          <label for="prompt-content">Prompt</label>
          <textarea id="prompt-content" name="content" rows="6" placeholder="Write your prompt here..." required></textarea>
        </div>
        <button type="submit" class="btn-primary">Save Prompt</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-heading">
      <h2 id="list-heading" class="panel-title">Saved Prompts</h2>
      <p id="empty-state" class="empty-state">No prompts saved yet.</p>
      <div id="prompt-list" class="prompt-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
