<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <h1 class="logo"><span class="logo-mark">&gt;_</span> Prompt Library</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        Dark
      </button>
    </div>
  </header>

  <main class="container main">
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading" class="panel-title">New Prompt</h2>
      <form id="prompt-form" class="prompt-form" autocomplete="off">
        <div class="field">
          <label for="prompt-title">Title</label>
          <input type="text" id="prompt-title" name="title" placeholder="e.g. Code review checklist" required />
        </div>
        <div class="field">
          <label for="prompt-content">Prompt</label>
          <textarea id="prompt-content" name="content" rows="6" placeholder="Write your prompt here..." required></textarea>
        </div>
        <div class="field">
          <label for="prompt-model">Model</label>
          <input type="text" id="prompt-model" name="model" maxlength="100" placeholder="e.g. claude-opus-5" />
        </div>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary">Save Prompt</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-heading">
      <div class="panel-head">
        <h2 id="list-heading" class="panel-title">Saved Prompts</h2>
        <div class="toolbar">
          <button id="export-btn" class="toolbar-btn" type="button">Export</button>
          <button id="import-btn" class="toolbar-btn" type="button">Import</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </div>
      </div>
      <p id="library-status" class="library-status" role="status" hidden></p>
      <p id="empty-state" class="empty-state">No prompts saved yet.</p>
      <div id="prompt-list" class="prompt-list"></div>
    </section>
  </main>

  <dialog id="import-dialog" class="dialog" aria-labelledby="import-dialog-title">
    <form method="dialog" class="dialog-form" id="import-dialog-form">
      <h2 id="import-dialog-title" class="dialog-title">Import prompts</h2>
      <p id="import-dialog-summary" class="dialog-summary"></p>
      <div class="dialog-actions">
        <button type="submit" value="merge-keep-existing" id="merge-keep-existing" class="dialog-btn">Merge</button>
        <button type="submit" value="merge-keep-imported" id="merge-keep-imported" class="dialog-btn">Merge, use imported</button>
        <button type="submit" value="replace" class="dialog-btn">Replace all</button>
        <button type="submit" value="cancel" class="dialog-btn dialog-btn-quiet">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
