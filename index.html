<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem('promptLibrary.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.25">
            <rect x="1.5" y="1.5" width="13" height="13" />
            <line x1="4.5" y1="5.5" x2="11.5" y2="5.5" />
            <line x1="4.5" y1="8" x2="11.5" y2="8" />
            <line x1="4.5" y1="10.5" x2="9" y2="10.5" />
          </svg>
        </span>
        <div>
          <h1>Prompt Library</h1>
          <h2>Standard Prompt</h2>
          <p class="brand-sub">Save, browse, and reuse your best prompts</p>
        </div>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch color theme">
        <span class="theme-icon" aria-hidden="true">
          <svg class="icon-moon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
            stroke-width="1.25">
            <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5Z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
            stroke-width="1.25">
            <circle cx="8" cy="8" r="3.25" />
            <line x1="8" y1="0.75" x2="8" y2="2.5" />
            <line x1="8" y1="13.5" x2="8" y2="15.25" />
            <line x1="0.75" y1="8" x2="2.5" y2="8" />
            <line x1="13.5" y1="8" x2="15.25" y2="8" />
          </svg>
        </span>
        <span class="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="panel panel--form" aria-labelledby="form-heading">
      <h2 id="form-heading" class="panel-title">New prompt</h2>

      <form id="prompt-form" novalidate>
        <div class="field">
          <label for="prompt-title">Title</label>
          <input type="text" id="prompt-title" name="title" placeholder="e.g. Blog Idea Generator" maxlength="120"
            autocomplete="off" required />
        </div>

        <div class="field">
          <div class="label-row">
            <label for="prompt-content">Prompt</label>
            <span class="char-count" id="content-count">0</span>
          </div>
          <textarea id="prompt-content" name="content" placeholder="Write the full prompt here…" rows="9"
            required></textarea>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Save prompt</button>
          <button type="reset" class="btn btn--ghost">Clear</button>
        </div>
      </form>
    </section>

    <section class="panel panel--list" aria-labelledby="list-heading">
      <div class="panel-header">
        <h2 id="list-heading" class="panel-title">Saved prompts</h2>
        <span id="prompt-count" class="badge" aria-live="polite">0</span>
      </div>

      <div id="empty-state" class="empty-state">
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.25">
            <rect x="3.5" y="2.5" width="17" height="19" />
            <line x1="7.5" y1="7.5" x2="16.5" y2="7.5" />
            <line x1="7.5" y1="12" x2="16.5" y2="12" />
            <line x1="7.5" y1="16.5" x2="12.5" y2="16.5" />
          </svg>
        </span>
        <p class="empty-title">No prompts yet</p>
        <p class="empty-hint">Saved prompts will appear here and stay in this browser.</p>
      </div>

      <ul id="prompt-list" class="cards"></ul>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <template id="prompt-card-template">
    <li class="card">
      <div class="card-head">
        <h3 class="card-title"></h3>
        <button type="button" class="icon-btn icon-btn--danger" data-action="delete">Delete</button>
      </div>
      <pre class="card-content"></pre>
      <div class="card-foot">
        <time class="card-date"></time>
        <button type="button" class="link-btn" data-action="copy">Copy</button>
      </div>
    </li>
  </template>

  <footer class="app-footer">
    Stored locally in your browser with <code>localStorage</code> — clearing site data removes your prompts.
  </footer>

  <script src="script.js"></script>
</body>

</html>
